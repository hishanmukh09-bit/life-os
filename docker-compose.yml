version: '3.8'

services:
  lifeos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeos-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
